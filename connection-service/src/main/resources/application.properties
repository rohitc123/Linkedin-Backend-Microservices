spring.application.name=connection-service
server.port=9010

# Neo4j configuration
spring.neo4j.uri=${NEO4J_URI:bolt://connection-db:7687}
spring.data.neo4j.database=${NEO4J_DATABASE:connectiondb}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# Eureka configuration
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/