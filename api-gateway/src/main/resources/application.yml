
jwt:
  secretKey:  ${JWT_SECRET_KEY}

spring:
  application:
    name: api-gateway

server:
  port: 9000


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Posts Service
        url: /posts-service/v3/api-docs
      - name: Connection Service
        url: /connection-service/v3/api-docs


eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      enabled: true